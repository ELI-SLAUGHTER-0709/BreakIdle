<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BreakIdle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>BreakIdle</h1>
      <button id="shopToggle" class="icon-btn" aria-label="Toggle shop">☰</button>
    </div>
    <div class="stats" id="headerStats"></div>
  </header>

  <main>
    <!-- LEFT PANEL (for future features) -->
    <aside class="side-panel left-panel" id="leftPanel" aria-hidden="false">
      <canvas id="leftCanvas" class="side-canvas" aria-label="Left panel canvas"></canvas>
    </aside>

    <!-- CENTER: GAME CANVAS -->
    <div class="canvas-wrap">
      <canvas id="game" width="800" height="520" aria-label="Game canvas"></canvas>
    </div>

    <!-- RIGHT PANEL: SHOP -->
    <aside class="side-panel shop" id="shop" aria-hidden="false">
      <canvas id="shopCanvas" class="side-canvas" aria-label="Shop canvas"></canvas>
    </aside>
  </main>

  <footer>Created By - Eli Slaughter</footer>

  <div class="bottom-bar" id="bottomBar" role="toolbar" aria-label="Game controls">
    <div class="bottom-left"></div>
    <div class="bottom-center"></div>
    <div class="bottom-right"></div>
  </div>

  <div id="rapidCooldownContainer" class="rapid-cooldown-container" aria-hidden="false" style="display:none;">
    <div class="rapid-label">Rapid Fire Cooldown</div>
    <div class="rapid-bar-wrap">
      <div id="rapidCooldownBar" class="rapid-fill" style="width:0%"></div>
    </div>
    <div id="rapidCooldownText" class="rapid-time">Ready</div>
  </div>

  <div id="floating-controls">
    <button id="clearBtn" aria-label="Reset progress" class="small-reset">Reset</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
