<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BreakIdle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rapid-fire.css">
  <link rel="stylesheet" href="upgrades-sidebar.css">
  <link rel="stylesheet" href="ui-fixes.css">
</head>
<body>
  <header>
    <div class="header-left"><h1>BreakIdle</h1></div>
    <div class="stats" id="headerStats"></div>
    <div class="settings-wrap">
      <button id="settingsToggle" class="icon-btn settings-toggle" type="button" aria-label="Settings" aria-controls="settingsMenu" aria-expanded="false" title="Settings">⚙</button>
      <section id="settingsMenu" class="settings-menu" aria-label="Settings menu" hidden>
        <div class="settings-heading"><h2>Settings</h2><button id="settingsClose" class="settings-close" type="button" aria-label="Close settings">×</button></div>
        <p class="settings-caption">More options coming soon.</p>
        <div class="settings-actions">
          <button type="button" class="settings-action" disabled>Sound <span>Coming soon</span></button>
          <button type="button" class="settings-action" disabled>Visual effects <span>Coming soon</span></button>
          <button type="button" class="settings-action" disabled>Gameplay options <span>Coming soon</span></button>
        </div>
        <div class="settings-divider"></div>
        <p class="settings-caption">Keyboard controls</p>
        <ul class="settings-controls">
          <li><span><kbd>←</kbd> <kbd>→</kbd></span> Move</li>
          <li><span><kbd>↑</kbd></span> Shoot</li>
          <li><span><kbd>Ctrl</kbd></span> Auto fire</li>
          <li><span><kbd>Shift</kbd> / <kbd>Space</kbd></span> Rapid fire</li>
        </ul>
        <button id="settingsReset" type="button" class="small-reset settings-reset">Reset progress</button>
      </section>
    </div>
  </header>

  <main>
    <div class="canvas-wrap"><canvas id="game" width="800" height="520" aria-label="BreakIdle game canvas"></canvas></div>
    <aside class="side-panel shop" id="shop" aria-label="Upgrade shop" aria-hidden="true">
      <canvas id="shopCanvas" class="side-canvas" aria-label="Shop upgrade panel"></canvas>
    </aside>
  </main>

  <aside class="right-action-rail" aria-label="Game actions">
    <button id="shopToggle" class="rail-action rail-action-primary" type="button" aria-label="Open upgrades" aria-controls="shop" aria-expanded="false">
      <span class="rail-action-icon" aria-hidden="true">⬆</span>
      <span class="rail-action-label">Upgrades</span>
    </button>
    <button class="rail-action" type="button" disabled><span class="rail-action-icon" aria-hidden="true">◆</span><span class="rail-action-label">Coming Soon</span></button>
    <button class="rail-action" type="button" disabled><span class="rail-action-icon" aria-hidden="true">◇</span><span class="rail-action-label">Coming Soon</span></button>
  </aside>

  <footer>Created By - Eli Slaughter</footer>
  <div class="bottom-bar" id="bottomBar" role="toolbar" aria-label="Game controls"><div class="bottom-left"></div><div class="bottom-center"></div><div class="bottom-right"></div></div>
  <div id="rapidCooldownContainer" class="rapid-cooldown-container" aria-hidden="true" hidden>
    <div class="rapid-label">Rapid Fire Cooldown</div>
    <div class="rapid-bar-wrap" role="progressbar" aria-label="Rapid fire cooldown" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="rapidCooldownBar" class="rapid-fill"></div></div>
    <div id="rapidCooldownText" class="rapid-time">Ready</div>
  </div>
  <script src="main.js"></script>
  <script src="settings.js"></script>
  <script src="rapid-fire-ui.js"></script>
  <script src="upgrades-sidebar.js"></script>
  <script src="ui-fixes.js"></script>
</body>
</html>
